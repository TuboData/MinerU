# PDF处理系统配置

# 数据库配置
mysql:
  host: mysql
  port: 3306
  user: root
  password: infini_rag_flow
  database: pdf_processor

# Redis配置
redis:
  host: redis
  port: 6379
  db: 2
  password: infini_rag_flow
  decode_responses: true

# MinIO配置
minio:
  endpoint: minio:9000
  access_key: rag_flow
  secret_key: infini_rag_flow
  secure: false
  bucket_name: pdf-processor

# 应用设置
app:
  output_dir: output
  max_workers: 4
  log_level: INFO
  clean_interval_hours: 24
  job_expiry_hours: 48